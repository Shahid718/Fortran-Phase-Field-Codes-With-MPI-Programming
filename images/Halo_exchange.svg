<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" font-family="monospace">
  
  <!-- Main box representing local array with halos -->
  <rect x="50" y="20" width="400" height="280" fill="none" stroke="#333" stroke-width="2"/>
  
  <!-- Halo row (top) - received from processor below -->
  <rect x="50" y="20" width="400" height="45" fill="#f5b7b1" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="47" text-anchor="middle" font-size="13" fill="#333">Row 32 (halo) — Received from Processor 0</text>
  
  <!-- Dashed divider -->
  <line x1="50" y1="65" x2="450" y2="65" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  
  <!-- Actual data section -->
  <rect x="50" y="65" width="400" height="190" fill="#d5e8d4" stroke="#333" stroke-width="1.5"/>
  
  <!-- Label for actual data -->
  <text x="250" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Actual Data (Rows 33-64)</text>
  
  <!-- Row indicators within actual data -->
  <text x="80" y="120" font-size="12" fill="#555">Row 33</text>
  <line x1="140" y1="115" x2="430" y2="115" stroke="#999" stroke-width="0.5"/>
  
  <text x="80" y="145" font-size="12" fill="#555">Row 34</text>
  <line x1="140" y1="140" x2="430" y2="140" stroke="#999" stroke-width="0.5"/>
  
  <text x="80" y="170" font-size="12" fill="#555">...</text>
  <line x1="140" y1="165" x2="430" y2="165" stroke="#999" stroke-width="0.5"/>
  
  <text x="80" y="200" font-size="12" fill="#555">Row 63</text>
  <line x1="140" y1="195" x2="430" y2="195" stroke="#999" stroke-width="0.5"/>
  
  <text x="80" y="225" font-size="12" fill="#555">Row 64</text>
  <line x1="140" y1="220" x2="430" y2="220" stroke="#999" stroke-width="0.5"/>
  
  <!-- Start and end markers -->
  <!-- <text x="150" y="250" font-size="11" fill="#27ae60">start_y = 33</text> -->
  <!-- <text x="320" y="250" font-size="11" fill="#27ae60">end_y = 64</text> -->
  
  <!-- Dashed divider -->
  <line x1="50" y1="255" x2="450" y2="255" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  
  <!-- Halo row (bottom) - received from processor above -->
  <rect x="50" y="255" width="400" height="45" fill="#f5b7b1" stroke="#333" stroke-width="1.5"/>
  <text x="250" y="282" text-anchor="middle" font-size="13" fill="#333">Row 65 (halo) — Received from Processor 2</text>
  
  <!-- Processor label on the side -->
  <rect x="460" y="65" width="30" height="190" fill="#d5e8d4" stroke="#333" stroke-width="1"/>
  <text x="475" y="160" text-anchor="middle" font-size="11" fill="#333" transform="rotate(90, 475, 160)">Processor 1</text>
  
</svg>